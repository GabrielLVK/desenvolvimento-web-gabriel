<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
    const tema = localStorage.getItem('tema') || 'light';
    document.documentElement.setAttribute('data-bs-theme', tema);
    </script>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">FaceGran</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="config.html">Configuração</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="height: 80vh;">
    <div class="card p-4" style="width: 300px;">
        <h4 class="mb-3 text-center">Cadastro</h4>

        <input type="text" class="form-control mb-2" placeholder="Nome de usuário">
        <input type="email" class="form-control mb-2" placeholder="Email">
        <input type="password" class="form-control mb-3" placeholder="Senha">

        <button id="btnCadastro" class="btn btn-success w-100 mb-2">Cadastrar</button>

        <a href="login.html" class="text-center">Já tenho conta</a>
    </div>
</div>

<script>
document.getElementById('btnCadastro').addEventListener('click', () => {
    const nome = document.querySelector('input[type="text"]').value;

    if (!nome) return alert('Digite o nome');

    localStorage.setItem('usuario', nome);
    window.location.href = 'index.html';
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
