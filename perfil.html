<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">FaceGran</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="config.html">Configuração</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card p-4 text-center">
        <img id="fotoPerfil" src="avatar.jpg" class="rounded-circle mx-auto mb-3" width="120">
        <h3 id="nomePerfil">Gabriel Luiz</h3>
        <p>Estudante de Desenvolvimento Web</p>
    </div>

    <div class="card p-4 mt-3">
        <h5>Bio</h5>
        <p id="bioPerfil">Olá! Sou Gabriel, moro em Planalto e estudo na Unochapecó.</p>
    </div>

    <div class="card p-4 mt-3">
        <h5>Interesses</h5>
        <p id="interessesPerfil">Programação, tecnologia, música</p>
    </div>

</div>

<script>
function aplicarTema() {
    const tema = localStorage.getItem('tema') || 'light';
    document.documentElement.setAttribute('data-bs-theme', tema);
}

aplicarTema();
</script>

<script>
const dados = JSON.parse(localStorage.getItem('perfil'));

if (dados) {
    if (dados.nome) document.getElementById('nomePerfil').textContent = dados.nome;
    if (dados.foto) document.getElementById('fotoPerfil').src = dados.foto;
    if (dados.bio) document.getElementById('bioPerfil').textContent = dados.bio;
    if (dados.interesses) document.getElementById('interessesPerfil').textContent = dados.interesses;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
