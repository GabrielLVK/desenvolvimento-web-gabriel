<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
    const tema = localStorage.getItem('tema') || 'light';
    document.documentElement.setAttribute('data-bs-theme', tema);
    </script>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">FaceGran</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link active" href="config.html">Configuração</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card p-4 mb-3">
        <h5>Editar Perfil</h5>

        <input id="nome" class="form-control mb-2" placeholder="Nome">
        <input id="foto" class="form-control mb-2" placeholder="URL da foto">
        <textarea id="bio" class="form-control mb-2" placeholder="Bio"></textarea>
        <input id="interesses" class="form-control mb-2" placeholder="Interesses">

        <button id="salvar" class="btn btn-primary">Salvar</button>
    </div>

    <div class="card p-4">
        <h5>Tema</h5>
        <button id="tema" class="btn btn-secondary">Alternar tema</button>
    </div>

</div>

<script>
document.getElementById('salvar').addEventListener('click', () => {
    const dados = {
        nome: document.getElementById('nome').value,
        foto: document.getElementById('foto').value,
        bio: document.getElementById('bio').value,
        interesses: document.getElementById('interesses').value
    };

    localStorage.setItem('perfil', JSON.stringify(dados));
    alert('Salvo');
});
</script>

<script>
document.getElementById('tema').addEventListener('click', () => {
    const atual = localStorage.getItem('tema') || 'light';
    const novo = atual === 'light' ? 'dark' : 'light';

    localStorage.setItem('tema', novo);
    document.documentElement.setAttribute('data-bs-theme', novo);
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
