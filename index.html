<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceGran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
    const tema = localStorage.getItem('tema') || 'light';
    document.documentElement.setAttribute('data-bs-theme', tema);
    </script>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">FaceGran</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Feed</a></li>
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="config.html">Configuração</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 600px;">

    <div class="card p-3 mb-4">
        <h5>Criar comentário</h5>
        <input id="nome" class="form-control mb-2" placeholder="Seu nome">
        <textarea id="mensagem" class="form-control mb-2" placeholder="Escreva algo"></textarea>
        <button id="btnEnviar" class="btn btn-primary">Postar</button>
    </div>

    <div id="feed"></div>

</div>

<script>
const feed = document.getElementById('feed');
const btn = document.getElementById('btnEnviar');

function iniciarComentarios() {
    if (!localStorage.getItem('comentarios')) {
        const iniciais = [
            { nome: 'Pedro', mensagem: 'Muito bom esse perfil!' },
            { nome: 'Ana', mensagem: 'Curti demais 🔥' },
            { nome: 'Carlos', mensagem: 'Top demais!' }
        ];

        localStorage.setItem('comentarios', JSON.stringify(iniciais));
    }
}

function renderComentarios() {
    feed.innerHTML = '';

    const comentarios = JSON.parse(localStorage.getItem('comentarios')) || [];

    comentarios.forEach(c => {
        const card = document.createElement('div');
        card.className = 'card p-3 mb-3';

        const h = document.createElement('h6');
        h.textContent = c.nome;

        const p = document.createElement('p');
        p.textContent = c.mensagem;

        card.appendChild(h);
        card.appendChild(p);

        feed.appendChild(card);
    });
}

btn.addEventListener('click', () => {
    const nome = document.getElementById('nome').value.trim();
    const mensagem = document.getElementById('mensagem').value.trim();

    if (!nome || !mensagem) return alert('Preencha tudo');

    const comentarios = JSON.parse(localStorage.getItem('comentarios'));

    comentarios.unshift({ nome, mensagem });

    localStorage.setItem('comentarios', JSON.stringify(comentarios));

    renderComentarios();

    document.getElementById('nome').value = '';
    document.getElementById('mensagem').value = '';
});

iniciarComentarios();
renderComentarios();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
